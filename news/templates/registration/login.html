<!-- Use the newspaper base template -->
{% extends "news/base.html" %}

<!-- Page title -->
{% block title %}
Login - MostOdd News
{% endblock %}

<!-- Main page content -->
{% block content %}

<h2>Login</h2>

<form method="post">

    <!-- Protect against CSRF attacks -->
    {% csrf_token %}

    <!-- Display the login form -->
    {{ form.as_p }}

    <!-- Submit button -->
    <button type="submit">
        Login
    </button>

</form>

<p>

    Don't have an account?

    <a href="{% url 'register' %}">
        Register
    </a>

</p>

{% endblock %}
